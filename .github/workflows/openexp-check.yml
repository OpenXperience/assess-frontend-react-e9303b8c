name: OpenExp Check
on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # continue-on-error is deliberate: a failing check is a result to report,
      # not a workflow crash that reports nothing. The cost is that the job
      # shows a green tick either way, so the summary below states the real
      # outcome in the one place the student is looking (ADR-043).
      - name: Run your acceptance checks (green tick below means the run finished, not that checks passed)
        id: checks
        continue-on-error: true
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund vitest@^3 jsdom@^25 @testing-library/react@^16 @testing-library/user-event@^14 @vitejs/plugin-react@^4
          mkdir -p "$(dirname "openexp/LoginFormSubmit.check.test.jsx")"
          cat > "openexp/LoginFormSubmit.check.test.jsx" <<'OPENEXP_TEST_EOF'
          import { afterEach, describe, expect, it, vi } from 'vitest';
          import { cleanup, render, screen } from '@testing-library/react';
          import userEvent from '@testing-library/user-event';
          import LoginForm from '../src/LoginForm.jsx';
          
          afterEach(cleanup);
          
          async function fillAndSubmit(user, onLogin) {
            render(<LoginForm onLogin={onLogin} />);
            await user.type(screen.getByLabelText(/email/i), 'ada@example.com');
            await user.type(screen.getByLabelText(/password/i), 'analytical1843');
            await user.click(screen.getByRole('button', { name: /submit|log ?in|sign ?in/i }));
          }
          
          describe('LoginForm submission', () => {
            it('keeps the inputs controlled', async () => {
              const user = userEvent.setup();
              render(<LoginForm />);
              const email = screen.getByLabelText(/email/i);
              await user.type(email, 'ada@example.com');
              expect(email.value).toBe('ada@example.com');
            });
          
            it('calls onLogin with the entered values', async () => {
              const user = userEvent.setup();
              const onLogin = vi.fn();
              await fillAndSubmit(user, onLogin);
              expect(onLogin).toHaveBeenCalledWith(
                expect.objectContaining({ email: 'ada@example.com', password: 'analytical1843' }),
              );
            });
          
            it('does not reload the page on submit', async () => {
              const user = userEvent.setup();
              const onLogin = vi.fn();
              let defaultPrevented = false;
              // Bubble phase, not capture: React's onSubmit runs during bubbling, so a
              // capture listener observes the event before preventDefault is called and
              // always reads false.
              const listener = (e) => { defaultPrevented = e.defaultPrevented; };
              window.addEventListener('submit', listener);
              await fillAndSubmit(user, onLogin);
              window.removeEventListener('submit', listener);
              expect(defaultPrevented).toBe(true);
            });
          
            it('shows a success indicator afterward', async () => {
              const user = userEvent.setup();
              await fillAndSubmit(user, vi.fn());
              expect(screen.getByText(/success|welcome|logged ?in|signed ?in/i)).toBeDefined();
            });
          });
          OPENEXP_TEST_EOF
          cat > openexp-vitest.config.mjs <<'OPENEXP_CONFIG_EOF'
          import react from '@vitejs/plugin-react';
          export default { plugins: [react()], test: { environment: 'jsdom', globals: false } };
          OPENEXP_CONFIG_EOF
          npx vitest run "openexp/LoginFormSubmit.check.test.jsx" --reporter=json --outputFile=openexp-result.json --config openexp-vitest.config.mjs
      - name: Tell the student what actually happened
        if: always()
        run: |
          if [ "${{ steps.checks.outcome }}" = "success" ]; then
            echo "## Your checks passed" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Everything this task asked for is in place." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Some checks did not pass" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "The green tick on this run means the run finished, not that your work passed — OpenExp needs the run to complete either way so it can read the result." >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Open the **Run your acceptance checks** step above to see which ones failed. OpenExp will show you the same list." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Summarise the run
        if: always()
        run: |
          COUNT=$(git rev-list --count origin/${{ github.base_ref }}..HEAD || echo 0)
          SHORT=$(git log origin/${{ github.base_ref }}..HEAD --pretty=%s | awk 'length($0) < 15' | wc -l | tr -d ' ')
          mkdir -p openexp-out
          cp openexp-result.json openexp-out/ 2>/dev/null || echo 'null' > openexp-out/openexp-result.json
          printf '{"runs":%s,"commits":%s,"shortMessages":%s}' \
            "${{ steps.checks.outcome == 'success' }}" "$COUNT" "${SHORT:-0}" \
            > openexp-out/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openexp-result
          path: openexp-out/
